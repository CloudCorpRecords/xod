name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch newly published vulnerabilities

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No private files, keys or home paths
        run: python3 scripts/check_release.py
      - name: Gitleaks (full history)
        # Run the scanner directly: the gitleaks action can't scan a push that includes the first commit.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  python:
    name: Python checks
    runs-on: macos-14   # Apple silicon, like the people running Xod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile
        run: python -m compileall -q app tests
      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --progress-spinner off

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --check main.js
      - name: Audit what ships in the app
        run: npm audit --omit=dev --audit-level=low
