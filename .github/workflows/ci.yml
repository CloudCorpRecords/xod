name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch newly published vulnerabilities

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: No private files, keys or home paths
        run: python3 scripts/check_release.py
      - name: Gitleaks (full history)
        # Run the scanner directly: the gitleaks action can't scan a push that includes the first commit.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  python:
    name: Python checks
    runs-on: macos-14   # Apple silicon, like the people running Xod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile
        run: python -m compileall -q app tests
      - name: Install Xod's packages
        run: python -m pip install -r requirements.txt
      # Not run_local_models_test: its stand-in 4.5 GB model doesn't fit in this 7 GB runner, so Xod rightly picks a smaller
      # one and a shorter context. The Windows job (16 GB) runs it; it's the same code.
      - name: The same checks Windows runs, on a Mac (stand-in models and servers)
        env:
          PYTHONUTF8: "1"
        run: |
          python tests/smoke/run_platform_smoke.py
          python tests/smoke/run_cloud_thinking_test.py
          python tests/smoke/run_phone_test.py
          python tests/smoke/run_vision_test.py
          python tests/smoke/run_models_test.py
          python tests/smoke/run_worker_test.py
          python tests/smoke/run_mcp_import_test.py
          python tests/smoke/run_sentinel_test.py
          python tests/smoke/run_goals_test.py
          python tests/smoke/run_team_test.py
          python tests/smoke/run_job_autofill_test.py
          python tests/smoke/run_tailor_test.py
          python tests/smoke/run_engine_watchdog_test.py
          python tests/smoke/run_agent_mail_chat_test.py
          python tests/smoke/run_home_post_test.py
          python tests/smoke/run_local_servers_test.py
          python tests/smoke/run_desktop_test.py
          python tests/smoke/run_agent_clis_test.py
          python tests/smoke/run_terminal_command_test.py
          python tests/smoke/run_terminals_edge_test.py
          python tests/smoke/run_crew_test.py
          python tests/smoke/run_evals_test.py
          python tests/smoke/run_mac_abilities_test.py
          python tests/smoke/run_cli_test.py
      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --progress-spinner off

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm ci
      - run: node --check main.js
      - name: Audit what ships in the app
        run: npm audit --omit=dev --audit-level=low
