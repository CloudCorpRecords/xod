name: Computer control
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  computer-control:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Synthetic command, failure and device-contract checks
        run: python tests/computer_control/test_control_contract.py
      - name: Real MCP transport with an explicit fake device
        run: python tests/computer_control/run_computer_control_test.py
