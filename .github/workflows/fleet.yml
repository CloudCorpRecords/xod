name: Fleet bridge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fleet:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - name: Install only locked published packages without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Discovery and approval boundaries, including missing/offline packages
        run: python tests/fleet_bridge/test_fleet_policy.py
      - name: Real published MCP round trips, no missing-tool skips
        run: python tests/fleet_bridge/run_fleet_bridge_test.py --require-tools
