name: Release

# Push a tag like v0.1.0 and this builds the Mac installer and attaches it to a draft release.
# Review the draft, then publish it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: Build Xod.dmg (Apple silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Standalone Python 3.12 to bundle
        run: uv python install 3.12
      - name: Release check
        run: python3 scripts/check_release.py
      - name: Build the installer
        working-directory: electron
        run: |
          npm ci
          npm run dist
      - name: The app's signature is intact (otherwise macOS calls it "damaged")
        run: codesign --verify --deep --strict --verbose=2 electron/dist/mac-arm64/Xod.app
      - name: Checksum
        working-directory: electron/dist
        run: shasum -a 256 Xod-*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Xod ${TAG#v}" --notes-file docs/CHANGELOG.md
          gh release upload "$TAG" electron/dist/Xod-*.dmg electron/dist/SHA256SUMS.txt --clobber
