name: Windows

# Xod on Windows, from scratch: the server and a full chat on a clean Windows machine, then the installer is built,
# installed the way a person would (per user, no admin), and the installed copy is started and tested.
# Runs on pushes to main that touch the app or the desktop shell, and by hand.
on:
  workflow_dispatch:
  push:
    branches: [main, windows-port]
    paths: ["app/**", "electron/**", "requirements.txt", "tests/smoke/**", ".github/workflows/windows.yml"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"        # as the app runs its Python on Windows (electron/main.js)

jobs:
  backend:
    name: Server and a chat on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Xod's packages
        run: python -m pip install -r requirements.txt
      - name: From scratch (secrets in Windows Credential Manager)
        env:
          XOD_REAL_KEYRING: "1"
        run: python tests/smoke/run_platform_smoke.py
      - name: Cloud models never end on thinking alone
        run: python tests/smoke/run_cloud_thinking_test.py
      - name: Local models through Ollama, edge cases (stand-in Ollama)
        run: python tests/smoke/run_local_models_test.py
      - name: Computer tools and spoken replies on Windows
        run: python tests/smoke/run_windows_tools_test.py
      - name: Xod on your phone (stand-in Telegram)
        run: python tests/smoke/run_phone_test.py
      - name: Eyes for models that can't see (stand-in Ollama)
        run: python tests/smoke/run_vision_test.py
      - name: Models, scores, what works and connecting (stand-in Ollama)
        run: python tests/smoke/run_models_test.py
      - name: The worker - installs, the done-check, pause and continue (scripted model)
        run: python tests/smoke/run_worker_test.py
      - name: Paste any MCP server - every format, asking the server, keys, connecting (stand-in servers)
        run: python tests/smoke/run_mcp_import_test.py
      - name: Sentinel - the safety check on every action
        run: python tests/smoke/run_sentinel_test.py
      - name: Goals and the morning brief (scripted model)
        run: python tests/smoke/run_goals_test.py
      - name: The team and Xod's page - tiers, subagents side by side, approvals history, reminders (scripted models)
        run: python tests/smoke/run_team_test.py
      - name: Your job profile from your résumé - whose it is, Google Drive, 'just do all' (stand-in Drive)
        run: python tests/smoke/run_job_autofill_test.py
      - name: Answers for each job, and pages that give AI orders (practice careers site, scripted model)
        run: python tests/smoke/run_tailor_test.py
      - name: Setting up Agent Mail from the chat, and mail between two Xods (a relay of its own)
        run: python tests/smoke/run_agent_mail_chat_test.py
      - name: Agent Mail with no shared post office - two Xods hosting their own, the outbox while one is off
        run: python tests/smoke/run_home_post_test.py
      # Not run_engine_watchdog_test: the built-in engine (MLX) is Mac only, so its watchdog never runs here. The Mac job runs it.

  installer:
    name: Build, install and run Xod-setup.exe
    needs: backend
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - name: Standalone Python 3.12 to bundle
        run: uv python install 3.12
      - name: Build the installer
        working-directory: electron
        run: |
          npm ci
          npm run dist:win
      - name: Install it (per user, silent)
        shell: pwsh
        timeout-minutes: 20
        run: |
          $exe = Get-ChildItem electron/dist/Xod-*-x64-setup.exe | Select-Object -First 1
          "Installer: $($exe.Name), $([math]::Round($exe.Length / 1MB)) MB"
          $t = Get-Date
          # Wait for the installer itself (Start-Process -Wait would also wait for anything it starts).
          $p = Start-Process $exe.FullName -ArgumentList "/S" -PassThru
          $p.WaitForExit()
          "Installed in $([math]::Round(((Get-Date) - $t).TotalSeconds)) s (exit $($p.ExitCode))"
          # Per-user installs go in %LOCALAPPDATA%\Programs\<package name> (xod-desktop); the Start menu says "Xod".
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Depth 1 -Filter Xod.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$app) { Get-ChildItem $env:LOCALAPPDATA\Programs; throw "Xod.exe not installed" }
          $dir = $app.DirectoryName
          "Installed at $dir"
          if (!(Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Xod.lnk"))) { "warning: no Start menu shortcut" }
          "INSTALL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: The installed copy works (its own Python, from scratch)
        shell: pwsh
        env:
          XOD_REAL_KEYRING: "1"
        run: |
          $env:XOD_BACKEND_DIR = Join-Path $env:INSTALL_DIR "resources\backend"
          python tests/smoke/run_platform_smoke.py --python (Join-Path $env:INSTALL_DIR "resources\python\python.exe")
      - name: The app itself starts and serves Xod
        shell: pwsh
        run: |
          $env:XOD_DATA_DIR = Join-Path $env:RUNNER_TEMP "xod-app-data"
          $env:XOD_NO_UPDATE_CHECK = "1"
          if (Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue) { throw "port 8000 is already in use before Xod starts" }
          $t = Get-Date
          $p = Start-Process (Join-Path $env:INSTALL_DIR "Xod.exe") -PassThru
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/ -TimeoutSec 2; if ($r.Content -match "<title>\s*Xod") { $ok = $true; break } } catch {}
          }
          $secs = [math]::Round(((Get-Date) - $t).TotalSeconds)
          # The server answering must be the installed app's own Python, started by Xod.exe.
          $owner = (Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1).OwningProcess
          $exePath = if ($owner) { (Get-Process -Id $owner).Path } else { "" }
          $data = Test-Path (Join-Path $env:XOD_DATA_DIR "xod.db")
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force
          if (!$ok) { throw "Xod.exe didn't start its server" }
          "Xod.exe opened and served the app in $secs s; server: $exePath; data folder created: $data"
          if ($exePath -notlike "$env:INSTALL_DIR*") { throw "the server on port 8000 isn't the installed Xod's ($exePath)" }
          if (!$data) { throw "Xod.exe didn't use its data folder" }
      - uses: actions/upload-artifact@v4
        with:
          name: Xod-windows-installer
          path: electron/dist/Xod-*-x64-setup.exe
          retention-days: 7
